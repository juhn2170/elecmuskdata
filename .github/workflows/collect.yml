name: collect

on:
  schedule:
    # 매일 01:17 KST, 03:47 KST (= 16:17, 18:47 UTC). 출근 전에 끝나게 새벽 두 번 (2026-11-22 사용자 요청).
    # GitHub 예약은 몇 시간 밀릴 수 있어(05:23 예약이 09:31에 돈 적 있음) 두 번째는 예비. 바뀐 게 없으면 version.json만 올린다.
    # 정시를 피해 예약 지연·누락을 줄인다.
    - cron: "17 16 * * *"
    - cron: "47 18 * * *"
  workflow_dispatch:

permissions:
  contents: write   # Release 게시, 실행 기록 커밋
  issues: write     # 실패하면 이슈를 열어 메일로 알림
  actions: write    # 워크플로 재활성화 (60일 무활동 대비)

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: cameras-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트
        run: python -m unittest discover -s tests

      - name: 지난 게시본 내려받기
        run: |
          mkdir -p prev
          gh release download "$TAG" -p cameras.db -p version.json -D prev || echo "지난 게시본 없음 (첫 게시)"

      - name: 수집
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/fetch.py out/raw.json

      - name: 구간단속 수집 (한국도로공사, 실패해도 지난 게시본 유지)
        continue-on-error: true
        run: python scripts/fetch_kec.py out/kec_sections.csv

      - name: 정제와 DB 생성
        id: build
        run: |
          python scripts/build.py out/raw.json prev out out/kec_sections.csv
          echo "status=$(python -c "import json;print(json.load(open('out/run.json'))['status'])")" >> "$GITHUB_OUTPUT"

      - name: Release 게시
        if: steps.build.outputs.status == 'published'
        run: |
          NOTES=$(python - <<'EOF'
          import json
          v = json.load(open("out/version.json"))
          print(f"버전 {v['version']} · {v['count']}건 (과속 {v['speed_count']}) · "
                f"추가 {v['added']} / 삭제 {v['removed']} / 변경 {v['changed']}\n\n{v['attribution']}")
          EOF
          )
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "카메라 데이터 (최신)" --notes "$NOTES" --latest
          fi
          # DB를 먼저 올리고 version.json을 마지막에 올린다 (앱이 새 버전을 보면 DB는 이미 준비됨)
          gh release upload "$TAG" out/cameras.db out/changes.json --clobber
          # 증분 패치 (지난 게시본 → 이번). 없으면 앱은 전체를 받는다.
          if [ -f out/patch.json.gz ]; then gh release upload "$TAG" out/patch.json.gz --clobber; fi
          gh release upload "$TAG" out/version.json --clobber
          gh release edit "$TAG" --notes "$NOTES"

      - name: 최신 확인 시각 게시 (바뀐 것 없음)
        if: steps.build.outputs.status == 'unchanged'
        run: gh release upload "$TAG" out/version.json --clobber

      - name: 실패 알림 (이슈 열기, GitHub이 메일로 알려 줌)
        if: failure() || steps.build.outputs.status == 'blocked'
        run: |
          TITLE="카메라 데이터 수집 실패 $(TZ=Asia/Seoul date +%F)"
          BODY="실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          앱은 마지막 게시본으로 계속 알림을 줍니다. 서비스키 만료·원본 형식 변경을 먼저 확인하세요."
          OPEN=$(gh issue list --label collect-failure --state open --json number -q '.[0].number' || true)
          if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --body "$BODY"
          else
            gh label create collect-failure --color B60205 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label collect-failure
          fi

      - name: 성공하면 실패 이슈 닫기
        if: success() && (steps.build.outputs.status == 'published' || steps.build.outputs.status == 'unchanged')
        run: |
          for n in $(gh issue list --label collect-failure --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "다음 실행에서 정상 수집됨"
          done

      - name: 실행 기록 커밋
        if: always()
        run: |
          python scripts/runlog.py out logs/runs.tsv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/runs.tsv
          git commit -m "실행 기록 $(TZ=Asia/Seoul date +%F)" || exit 0
          git pull --rebase
          git push

      - name: 워크플로 재활성화 (60일 무활동 대비)
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable" || true
